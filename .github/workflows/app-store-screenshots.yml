name: App Store screenshots

on:
  workflow_call:

env:
  PYTHON_VERSION: '3.14'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  capture:
    name: Capture upload bundle
    runs-on: macos-26
    # The two simulator passes can consume almost 35 minutes on hosted runners;
    # leave enough time for artifact upload and action cleanup.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Restore marketing Xcode cache
        uses: actions/cache@v6
        with:
          path: ios/PlaniniIOS/.derived-marketing-screenshots
          key: ios-marketing-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('ios/PlaniniIOS/Package.resolved') }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Invoke
        run: python -m pip install invoke
      - name: Install native image dependencies
        run: brew install cairo
      - name: Expose native image library path
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"
      - name: Bootstrap backend dependencies
        run: python -m invoke bootstrap-ci
      - name: Install XcodeGen
        run: python -m invoke install-xcodegen
      - name: Capture App Store screenshots
        run: python -m invoke check-ios-marketing-screenshots --preserve-derived-data
      - name: Upload App Store screenshot bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-marketing-screenshots
          retention-days: 7
          path: |
            e2e-artifacts/ios-marketing-screenshots/**/*.png
            e2e-artifacts/ios-marketing-screenshots/summary.md
      - name: Add download instructions
        if: always()
        run: |
          {
            echo "## App Store screenshots"
            echo
            echo "Download the \`ios-marketing-screenshots\` artifact from this workflow run."
            echo
            echo "On \`main\`, the same files are also attached to the GitHub Release as a versioned ZIP."
            echo
            echo "[Open workflow artifacts](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"
